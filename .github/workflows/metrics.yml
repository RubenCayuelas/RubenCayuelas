name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"     # actualiza una vez al día
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Métricas generales del perfil (commits, lenguajes, actividad...)
      - name: Metrics generales
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          user: RubenCayuelas
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_followup: yes
          plugin_followup_sections: repositories
          repositories: 1000
          repositories_forks: yes
# Plugin de topics: muestra los topics de GitHub que tienes marcados con estrella
      - name: Starred topics
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          base: ""
          filename: metrics.plugin.topics.svg
          plugin_topics: yes
          plugin_topics_mode: icons     # labels/icons
          plugin_topics_sort: stars
          plugin_topics_limit: 12
